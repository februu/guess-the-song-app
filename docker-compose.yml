services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: backend/.env
    environment:
      DB_DIR: /data
      FRONTEND_URL: "${FRONTEND_URL:-http://${HOST_IP}:3000}"
      SPOTIFY_REDIRECT_URI: "${SPOTIFY_REDIRECT_URI:-http://${HOST_IP}:8000/callback}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-${HOST_IP},localhost,127.0.0.1}"
    volumes:
      - sqlite_data:/data
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-}"
        NEXT_PUBLIC_BACKEND_WS_URL: "${NEXT_PUBLIC_BACKEND_WS_URL:-}"
    ports:
      - "0.0.0.0:3000:3000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./Caddyfile.present:/etc/caddy/Caddyfile
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sqlite_data:
  redis_data:
