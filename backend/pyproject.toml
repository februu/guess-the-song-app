[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "channels-redis>=4.3.0",
    "channels[daphne]>=4.3.2",
    "django>=6.0.3",
    "django-cors-headers>=4.9.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "yt-dlp>=2026.3.17",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
test = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings_test"
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
